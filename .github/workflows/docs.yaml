name: Docs

# Builds the site. Docs deploy (docs-deploy.yaml) publishes it: main at the root, a PR under pr-preview/pr-<number>.
on:
  push:
    branches: [main]
    paths: [docs/**, website/**, .github/workflows/docs.yaml]
  pull_request:
    branches: [main]
    paths: [docs/**, website/**, .github/workflows/docs.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          DOCS_BASE_URL: ${{ github.event_name == 'pull_request' && format('/llm-d-resiliency-operator/pr-preview/pr-{0}/', github.event.number) || '' }}
      - if: github.event_name == 'pull_request'
        run: echo "$NUMBER" > build/pr-number
        env:
          NUMBER: ${{ github.event.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: website/build
          retention-days: 7
