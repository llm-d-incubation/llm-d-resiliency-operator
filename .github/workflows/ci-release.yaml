name: CI - Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set project name from repository
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "project_name=$repo" >> "$GITHUB_OUTPUT"

      - name: Determine tag
        id: tag
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: ${{ steps.meta.outputs.project_name }}
          tag: ${{ steps.tag.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.tag.outputs.prerelease }}

      - name: Trivy security scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ghcr.io/llm-d-incubation/${{ steps.meta.outputs.project_name }}:${{ steps.tag.outputs.tag }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ghcr.io/llm-d-incubation/${{ steps.meta.outputs.project_name }}
        run: |
          flags=(--verify-tag --generate-notes --notes "Image: \`$IMAGE:$TAG\`")
          [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"
        shell: bash
