<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<text x="32.0" y="42.0" font-size="20" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">IRO at a glance</text>
<text x="32.0" y="66.0" font-size="13" fill="#5f6368" text-anchor="start" xml:space="preserve">one manager per engine group · the controller only talks to its plugins</text>
<rect x="30.0" y="92.0" width="790.0" height="620.0" rx="10" fill="#fbfcff" stroke="#1a73e8" stroke-width="2"/>
<text x="48.0" y="118.0" font-size="14" fill="#1a73e8" text-anchor="start" font-weight="700" xml:space="preserve">IRO manager  (leader-elected)</text>
<rect x="60.0" y="330.0" width="210.0" height="100.0" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="74.0" y="354.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Controller</text>
<text x="74.0" y="374.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">one step per poll</text>
<text x="74.0" y="392.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">saves, executes, checks</text>
<rect x="540.0" y="140.0" width="260.0" height="66.0" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="554.0" y="164.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Journal</text>
<text x="554.0" y="184.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">versioned record, Load / Save</text>
<rect x="540.0" y="260.0" width="260.0" height="78.0" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="554.0" y="284.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Workload</text>
<text x="554.0" y="304.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">one group of Pods</text>
<text x="554.0" y="322.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">Pod identity, Reset, Release</text>
<rect x="540.0" y="380.0" width="260.0" height="170.0" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<text x="554.0" y="404.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Engine</text>
<text x="554.0" y="424.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">one plugin per inference engine</text>
<rect x="554.0" y="442.0" width="112.0" height="90.0" rx="6" fill="#ffffff" stroke="#1e8e3e" stroke-width="2"/>
<text x="568.0" y="466.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Policy</text>
<text x="568.0" y="486.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">pure: decides</text>
<text x="568.0" y="504.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">no I/O</text>
<rect x="676.0" y="442.0" width="112.0" height="90.0" rx="6" fill="#ffffff" stroke="#1e8e3e" stroke-width="2"/>
<text x="690.0" y="466.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Driver</text>
<text x="690.0" y="486.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">reads, applies</text>
<text x="690.0" y="504.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">over HTTP</text>
<rect x="540.0" y="620.0" width="260.0" height="60.0" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="554.0" y="644.0" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Telemetry</text>
<text x="554.0" y="664.0" font-size="12.5" fill="#5f6368" text-anchor="start" xml:space="preserve">metrics, Events, logs</text>
