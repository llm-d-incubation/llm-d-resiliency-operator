apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recoveryrequests.inference.llm-d.io
spec:
  group: inference.llm-d.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeName:
                  type: string
                deviceID:
                  type: string
                errorCode:
                  type: string
                requestedAction:
                  type: string
                  enum: [RESET_DEVICE, REBOOT_NODE, REPLACE_NODE]
              required: [nodeName, requestedAction]
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, InProgress, Completed, Failed]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
  scope: Namespaced
  names:
    plural: recoveryrequests
    singular: recoveryrequest
    kind: RecoveryRequest
    shortNames:
      - rr
